
[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
gcode:
    BED_MESH_CLEAR
    G0 Z{printer["gcode_macro _CALIBRATION_SWITCH"].z} F10000
    G0 X{printer["gcode_macro _CALIBRATION_SWITCH"].x} Y{printer["gcode_macro _CALIBRATION_SWITCH"].y} F10000

# Called by CALIBRATE_ALL_OFFSETS for every tool, once the tool is picked up and
# its heater is on, before the tool moves over the calibration probe. It does
# nothing, override it in toolchanger-config.cfg to clean the hot nozzle, for
# example on a brush (an example is in toolchanger-config.cfg).
#   T         number of the tool
#   EXTRUDER  name of the extruder of the tool, wait for its temperature with
#             TEMPERATURE_WAIT SENSOR={params.EXTRUDER} MINIMUM={params.TEMP}
#   TEMP      temperature the tool is heated to for the measurement. Keep the
#             nozzle at it, the length of the nozzle depends on the temperature.
# The height of the toolhead is not known here, go to a safe Z before XY moves.
[gcode_macro _CALIBRATION_CLEAN_NOZZLE]
description: Hook of CALIBRATE_ALL_OFFSETS, runs before each tool is measured. Does nothing, override it.
gcode:

[gcode_macro CALIBRATE_ALL_OFFSETS]
gcode:
    {% set tools = printer.toolchanger.tool_numbers %}
    {% set names = printer.toolchanger.tool_names %}
    # Tool 0
    SELECT_TOOL T={tools[0]}  RESTORE_AXIS=XYZ
    STOP_CRASH_DETECTION
    M104 S150
    _CALIBRATION_CLEAN_NOZZLE T={tools[0]} EXTRUDER={printer[names[0]].extruder} TEMP=150
    CALIBRATE_MOVE_OVER_PROBE
    TEMPERATURE_WAIT SENSOR='{printer[names[0]].extruder}' MINIMUM=150
    TOOL_LOCATE_SENSOR
    M104 S0
    {% for tool in tools[1:] %}
        SELECT_TOOL T={tool}  RESTORE_AXIS=Z
        STOP_CRASH_DETECTION
        M104 S150 T{tool}
        _CALIBRATION_CLEAN_NOZZLE T={tool} EXTRUDER={printer[names[loop.index]].extruder} TEMP=150
        CALIBRATE_MOVE_OVER_PROBE
        TEMPERATURE_WAIT SENSOR='{printer[names[loop.index]].extruder}' MINIMUM=150
        TOOL_CALIBRATE_TOOL_OFFSET
        _SAVE_TOOL_OFFSET T={tool}
        M104 S0
    {% endfor %}
    
    # Finish up
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XZ
    TURN_OFF_HEATERS

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
gcode:
    {% if printer.tools_calibrate.last_probe_offset is not defined %}
        {action_raise_error("TOOL_CALIBRATE_PROBE_OFFSET is not part of Kalico's own tools_calibrate, see kalico.md")}
    {% endif %}
    CALIBRATE_MOVE_OVER_PROBE
    M109 S150
    TOOL_LOCATE_SENSOR
    TOOL_CALIBRATE_PROBE_OFFSET
    M104 S0


[gcode_macro _SAVE_TOOL_OFFSET]
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset VALUE="{printer.tools_calibrate.last_result[0]}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset VALUE="{printer.tools_calibrate.last_result[1]}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_result[2]}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset

[gcode_macro _SAVE_Z_TOOL_OFFSET]
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_result[2]}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset
