# ktce_noprobe.cfg with the hook of CALIBRATE_ALL_OFFSETS overridden to brush the hot
# nozzle, as a user of AFC would in toolchanger-config.cfg (tools_calibrate.md).
# Used by ktce_hook.test.

[include ktce_noprobe.cfg]

# Stand-ins for what AFC provides on a printer that uses it
[gcode_macro _AFC_BRUSH_VARS]
variable_brush_loc: 45,10,1
gcode:

[gcode_macro AFC_BRUSH]
variable_count: 0
gcode:
    SET_GCODE_VARIABLE MACRO=AFC_BRUSH VARIABLE=count VALUE={printer["gcode_macro AFC_BRUSH"].count + 1}

# The hook of CALIBRATE_ALL_OFFSETS as shown in tools_calibrate.md, brushing the hot
# nozzle, and a record of how it was called
[gcode_macro _CALIBRATION_CLEAN_NOZZLE]
variable_calls: ''
gcode:
    {% set brush = printer["gcode_macro _AFC_BRUSH_VARS"].brush_loc %}
    G90
    G0 Z{printer["gcode_macro _CALIBRATION_SWITCH"].z} F10000
    G0 X{brush[0]} Y{brush[1]} F10000
    TEMPERATURE_WAIT SENSOR={params.EXTRUDER} MINIMUM={params.TEMP}
    AFC_BRUSH
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_CLEAN_NOZZLE VARIABLE=calls VALUE="'{printer["gcode_macro _CALIBRATION_CLEAN_NOZZLE"].calls}T{params.T}={params.EXTRUDER}@{params.TEMP},'"
