# The shape of a printer without tool probes, like one with a Cartographer or Beacon
# on the shuttle: toolchanger, macros, calibration macros and crash detection of
# KTC-E (installed by install.sh), two tools, the calibration switch. Kalico's own
# tools_calibrate. Used by ktce_noprobe.test and, on Klipper, by klipper_noprobe.cfg.

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 200
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 200
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PJ2
position_endstop: 0
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[extruder1]
step_pin: PL7
dir_pin: PL5
enable_pin: !PL4
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK7
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[respond]

[pause_resume]

[tools_calibrate]
pin: ^PH3
travel_speed: 20
spread: 7
lower_z: 0  # the simulator triggers at the end of the move, there is no room to go lower
speed: 2
lift_speed: 4
final_lift_z: 6

[gcode_macro _CALIBRATION_SWITCH]
variable_x: 100
variable_y: 100
variable_z: 5
gcode:

[include ktce_printer/toolchanger/readonly-configs/toolchanger.cfg]
[include ktce_printer/toolchanger/readonly-configs/toolchanger-macros.cfg]
[include ktce_printer/toolchanger/readonly-configs/calibrate-offsets.cfg]
[include ktce_printer/toolchanger/readonly-configs/crash-detection.cfg]

# What a user puts in toolchanger-config.cfg, which comes last

[rounded_path]
resolution: 0.2

[toolchanger]
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
params_safe_y: 120
params_close_y: 30
params_fast_speed: 10000
params_path_speed: 900
require_tool_present: False

[tool T0]
tool_number: 0
extruder: extruder
params_park_x: 20
params_park_y: 5
params_park_z: 100

[tool T1]
tool_number: 1
extruder: extruder1
params_park_x: 60
params_park_y: 5
params_park_z: 100
