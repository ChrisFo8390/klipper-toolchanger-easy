# KTC-E on Kalico: two tools with a tap (tool probe) each, driven through the
# modules in klippy/plugins. Used by ktce_basic.test.
#
# The simulator (batch mode) reports every endstop and probe pin as open, so no
# tool is detected by itself; the test selects the active tool probe with
# SET_ACTIVE_TOOL_PROBE.

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 200

[stepper_z1]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 8

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[extruder1]
step_pin: PL7
dir_pin: PL5
enable_pin: !PL4
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK7
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[respond]

[pause_resume]

[bed_mesh]
mesh_min: 30,30
mesh_max: 170,170
probe_count: 3,3

[z_tilt]
z_positions:
    -50, 100
    250, 100
points:
    30, 100
    170, 100

# --- KTC-E -------------------------------------------------------------------

[rounded_path]
resolution: 0.2

[toolchanger]
initialize_on: manual
require_tool_present: False
params_close_y: 15
params_safe_y: 120
params_fast_speed: 30000
params_path_speed: 900
before_change_gcode:
    RESPOND TYPE=echo MSG="before change"
after_change_gcode:
    RESPOND TYPE=echo MSG="after change {tool.name}"
    # stands in for the tool detection of the real setup (DETECT_ACTIVE_TOOL_PROBE)
    SET_ACTIVE_TOOL_PROBE T={tool.tool_number}

[tool T0]
tool_number: 0
extruder: extruder
pickup_gcode:
    RESPOND TYPE=echo MSG="pickup T0"
dropoff_gcode:
    RESPOND TYPE=echo MSG="dropoff T0"

[tool T1]
tool_number: 1
extruder: extruder1
pickup_gcode:
    RESPOND TYPE=echo MSG="pickup T1"
dropoff_gcode:
    RESPOND TYPE=echo MSG="dropoff T1"

[tool_probe_endstop]
crash_gcode:
    RESPOND TYPE=error MSG="Tool crash"

[tool_probe T0]
pin: ^PH6
tool: 0
x_offset: 0
y_offset: 0
z_offset: 1.0
speed: 5.0
samples: 2
samples_result: median
samples_tolerance: 0.5
activate_gcode:
    RESPOND TYPE=echo MSG="activate probe T0"

[tool_probe T1]
pin: ^PH4
tool: 1
x_offset: 0.1
y_offset: -0.2
z_offset: 1.5
speed: 5.0
samples: 2
samples_result: median
samples_tolerance: 0.5

[tools_calibrate]
pin: ^PH3
travel_speed: 20
spread: 7
lower_z: 0  # the simulator triggers at the end of the move, there is no room to go lower
speed: 2
lift_speed: 4
final_lift_z: 6
