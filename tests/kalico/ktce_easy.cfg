# KTC-E "easy-additions" on Kalico: the configuration that install.sh puts in
# place (tests/kalico/run.sh builds ktce_printer/ with it) and a single tool on
# its own toolhead board with a tap, like examples/.../tap_per_tool/example_T0.cfg.
# Used by ktce_easy.test.
#
# A single tool, because the simulator reports every probe pin as open: with
# more than one tool probe there is no way to tell which tool is mounted.

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 200  # at the maximum like a Voron, the homing macro moves back from it
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 200  # at the maximum like a Voron, the homing macro moves back from it
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 200

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[respond]

[pause_resume]

[bed_mesh]
mesh_min: 30,30
mesh_max: 170,170
probe_count: 3,3

[tools_calibrate]
pin: ^PH3
travel_speed: 20
spread: 7
lower_z: 0  # the simulator triggers at the end of the move, there is no room to go lower
speed: 2
lift_speed: 4
final_lift_z: 6

[gcode_macro _CALIBRATION_SWITCH]
variable_x: 100
variable_y: 100
variable_z: 5
gcode:

[include ktce_printer/toolchanger/readonly-configs/toolchanger-include.cfg]

# The part of the user configuration that has to be completed, see
# toolchanger-config.cfg: later values win, so it goes after the include.
[gcode_macro homing_override_config]
variable_sensorless_x: False
variable_sensorless_y: False
variable_homing_rebound_y: 0
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49
